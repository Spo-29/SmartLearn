services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RUN_DB_BOOTSTRAP: 'false'
    ports:
      - '9000:80'
    volumes:
      - ./server/.env:/var/www/html/.env
      - ./server/public/upload:/var/www/html/public/upload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: smartlearn
    ports:
      - '3306:3306'
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - '9090:80'
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
