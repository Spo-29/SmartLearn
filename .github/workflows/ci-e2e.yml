name: CI E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare server env file
        run: |
          cp server/.env.example server/.env
          APP_KEY_VALUE="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY_VALUE}|" server/.env

      - name: Build and start CI stack (temporary MySQL via Docker Compose)
        run: docker compose up -d --build

      - name: Run smoke e2e checks
        run: bash scripts/e2e-smoke.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
