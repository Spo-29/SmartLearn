services:
  - type: web
    name: smartlearn-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeployTrigger: off
    healthCheckPath: /api/health
    preDeployCommand: /bin/bash -lc "bash scripts/render-db-init.sh"
    envVars:
      - key: APP_NAME
        value: SmartLearn
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        value: REQUIRED
      - key: MYSQL_ATTR_SSL_CA
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VITE_BACKEND_ENDPOINT
        value: ''
